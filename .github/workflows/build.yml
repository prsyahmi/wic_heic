name: Build

on:
  push:
    branches: [ "master" ]
    tags:
      - "v*.*"
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "master" ]

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'
        fetch-tags: 'true'
        fetch-depth: 0

    - name: 3rd party check
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        $SHA = git log -1 --format="%H" -- wic_heic/3rdparty
        echo "Cache key: $SHA"
        echo "CACHE_KEY=$SHA" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Cache 3rd party build
      id: cache-ext
      uses: actions/cache@v4
      with:
        key: ${{ runner.os }}-3rdparty-${{ env.CACHE_KEY }}
        path: |
          .\wic_heic\3rdparty\_out
          .\wic_heic\3rdparty\_tmp

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Restore NuGet Packages
      run: msbuild /t:Restore ${{env.SOLUTION_FILE_PATH}}

    - name: 3rd party build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      if: steps.cache-ext.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        cd .\wic_heic\3rdparty
        build.bat

    - name: Determine version
      id: version
      shell: bash
      run: |
        # Get the most recent tag using git describe
        BASE_TAG=$(git describe --tags --abbrev=0 --match="v[0-9]*.[0-9]*" --exclude="v[0-9]*.[0-9]*.[0-9]*")

        # Remove 'v' prefix to get base version
        BASE_VERSION="${BASE_TAG#v}"

        PREV_TAG=$(git describe --tags --abbrev=0)

        # Count commits since the tag
        COMMIT_SINCE_TAG=$(git rev-list --count "${BASE_TAG}..HEAD")
        echo "Commits since first commit: ${COMMIT_SINCE_TAG}"

        # Determine final version
        FINAL_VERSION="${BASE_VERSION}.${COMMIT_SINCE_TAG}"

        echo "Base version: ${BASE_VERSION}"
        echo "Prev version: ${PREV_TAG}"
        echo "This version: ${FINAL_VERSION}"

        echo "THIS_VERSION=${FINAL_VERSION}" >> "$GITHUB_OUTPUT"
        echo "BASE_TAG=${BASE_TAG}" >> "$GITHUB_OUTPUT"
        echo "BASE_VERSION=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
        echo "PREV_TAG=${PREV_TAG}" >> "$GITHUB_OUTPUT"

    - name: Version Tagging
      run: |
        cd '.\Installer'
        $VER='${{ steps.version.outputs.THIS_VERSION }}'.Replace('v','')
        (Get-Content Package.wxs).Replace('1.0.0', $VER) | Set-Content Package.wxs

    - name: Build x86
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x86 ${{env.SOLUTION_FILE_PATH}}

    - name: Build x64
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        path: ./(Build)
        retention-days: 1

    - name: Zip build files
      if: ${{ github.event_name != 'pull_request' }}
      shell: cmd
      run: |
        7z a -tzip WicHeic-${{ steps.version.outputs.THIS_VERSION }}.zip "(Build)/"

    - name: Version Tagging
      if: ${{ github.event_name != 'pull_request' }}
      run: |
        Rename-Item -Path ".\(Build)\x64\Release\en-US\WicHeic.msi" -NewName "WicHeic_v${{ steps.version.outputs.THIS_VERSION }}-x64.msi"
        Rename-Item -Path ".\(Build)\x86\Release\en-US\WicHeic.msi" -NewName "WicHeic_v${{ steps.version.outputs.THIS_VERSION }}-x86.msi"

    - name: Release
      uses: softprops/action-gh-release@v3
      if: ${{ github.event_name != 'pull_request' }}
      with:
        tag_name: v${{ steps.version.outputs.THIS_VERSION }}
        previous_tag: ${{ steps.version.outputs.PREV_TAG }}
        body_path: CHANGELOG_LATEST.md
        files: |
          ./(Build)/x64/Release/en-US/wicheic_v${{ steps.version.outputs.THIS_VERSION }}-x64.msi
          ./(Build)/x86/Release/en-US/wicheic_v${{ steps.version.outputs.THIS_VERSION }}-x86.msi
          *.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
